<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
            <label for="56">First Name:</label>
            <input type="text" id="56" placeholder="free" required>
        </div>
        <br>
        <div>
            <label for="lname">Last Name:</label>
            <select type="text" id="lname" placeholder="select all" required>
                <option>Select a name.....</option>
                <option>kemi</option>
                <option>lanre</option>
                <option>bolu</option>
            </select>
        </div>
        <br>
        <div>
            <label for="comm">Address:</label>
            <input type="text" id="comm" placeholder="The pizzas are so nice" required>
        </div>
        <br>
        <div>
            <label for="date">Date:</label>
            <input type="date" id="date" placeholder="mm/yy/dd" required>
        </div>
        <br>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" required>
        </div>
        <div>
            <label for="good">Good</label>
            <input type="radio" id="good" name="try">

            <label for="bad">Bad</label>
            <input type="radio" id="bad" name="try">

            <label for="vbad">Very bad</label>
            <input type="radio" id="vbad" name="try">
        </div>
        <input type="reset">
        <input type="submit">
        
    </form>
</body>
</html>
